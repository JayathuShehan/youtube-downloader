name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or the use case, not just the solution.
      placeholder: I often download several videos and want to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: How you imagine the feature in the command line and/or web UI.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this hasn't been suggested yet.
          required: true
        - label: This feature isn't mainly for getting around DRM or paywalls (members-only, rented or purchased videos).
          required: true
